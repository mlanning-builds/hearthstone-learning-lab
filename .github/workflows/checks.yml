name: Simulator checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: make install-dev
      - run: make quality
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make install-core
      - run: make smoke
  rules:
    needs: [quality, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Check supporting tools
        run: |
          python tools/check_without_training.py --suite supporting
          python -m unittest discover -s tools/tests
      - name: Check candidate inventory
        run: python tools/sync_candidate_inventory.py --engine-root staging/rebased-88
      - name: Run full non-training simulator rules
        working-directory: staging/rebased-88
        run: python ../../tools/check_without_training.py --suite candidate --workers 4
  research-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only research test dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[neural,research]'
      - name: Check model interfaces and mocked checkpoint resume
        run: |
          python -m unittest discover -s tests -p test_matched_games_research.py
          python -m unittest discover -s tests -p test_research_comparison.py
      - name: Check public artifacts
        run: python tools/check_public_artifacts.py
