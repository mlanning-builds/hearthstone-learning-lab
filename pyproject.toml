[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hearthstone-learning-lab"
version = "0.1.0"
description = "An experimental Hearthstone rules simulator and owner-run learning lab"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5"]
neural = ["torch>=2.2,<2.9", "numpy>=1.24,<2.1"]
dev = ["ruff>=0.9,<1", "mypy>=1.8,<1.15"]
research = ["matplotlib>=3.7,<3.10"]

[tool.setuptools]
py-modules = ["lab"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hearthstone_sim", "hearthstone_sim.*", "engine", "engine.*", "expanded", "expanded.*", "learner", "learner.*", "standard", "standard.*"]
exclude = ["staging*", "tests*", "tools*", "backups*"]

[tool.ruff]
target-version = "py39"
line-length = 100
include = ["hearthstone_sim/**/*.py", "tools/smoke_simulator.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
# Strict typing remains staged for the established public facade.
files = ["hearthstone_sim/__init__.py", "hearthstone_sim/_bootstrap.py", "hearthstone_sim/status.py"]
strict = true
follow_imports = "skip"
